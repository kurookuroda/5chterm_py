[project]
name = "x5ch-py"
version = "0.1.0"
description = "5chanterm (x5ch) の Python(asyncio)ポート — フェーズ1〜5(コア基盤+非対話CLI)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "textual>=8.0",
]

[project.scripts]
x5ch = "x5ch.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
